# mcp suite - the stdio MCP server (@devdigest/mcp), a thin adapter over the HTTP API.
# Tests are hermetic: an in-memory MCP client plus a mock API. The stdio guard test
# spawns `npx tsx src/server.ts`, which resolves tsx from node_modules after `npm ci`.
# Uses npm (package-lock.json); test:it (needs the seeded stack) is not run in CI.
#
# server/src/vendor/shared/** is in the path filter because mcp imports its types
# (type-only) through the @devdigest/shared tsconfig alias.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
